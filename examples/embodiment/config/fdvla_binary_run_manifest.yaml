schema_version: 1
primary_method: D-PPO
initial_checkpoint:
  path_env: GR00T_MODEL_PATH
  require_absolute_path: true
  record_sha256: true
development_initial_checkpoint_screen:
  purpose: avoid_ceiling_effect_before_formal_pilot
  formal_result: false
  candidates:
    weak1000:
      path_env: FDVLA_SCREEN_CKPT_WEAK1000
      recorded_training_step: 1000
    weak1500:
      path_env: FDVLA_SCREEN_CKPT_WEAK1500
      recorded_training_step: 1500
    weak1000plus500:
      path_env: FDVLA_SCREEN_CKPT_WEAK1000PLUS500
      recorded_training_step: 500
      note: continuation lineage must remain explicit; do not interpret as total exposure
  excluded_candidates:
    weak2000: embodiment_id fingerprint differs from the common checkpoint family
  paired_condition:
    task_id: 0
    semantic_age_frames: 6
    action_execution_horizon: 8
    action_prediction_horizon: 16
    policy_noise_seed: 12026
    unique_trials: 50
  selection_rule:
    target_success_rate: 0.45
    preferred_interval: [0.30, 0.60]
    primary: minimize_absolute_distance_to_target_success_rate
    tie_break_order: [weak1500, weak1000plus500, weak1000]
    correctness_requirements:
      nonbootstrap_requested_actual_age_mismatches: 0
      cross_episode_packet_mismatches: 0
      local_vlm_forward_count: 0
  isolation:
    selection_policy_noise_seed_must_not_enter_formal_eval: true
    formal_eval_policy_noise_seeds: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033]
    selection_results_must_be_labeled_development: true
    selected_checkpoint_must_be_locked_for_all_methods: true
  observed_after_preregistration:
    formal_result: false
    report: logs/fdvla_initial_checkpoint_screen/20260821_codefrozen_v2_age6_ka8_noise12026/selection_report.json
    worktree_sha256: 8fa77902ed3d4d1c2ce1f8113434790f5750260819be63480a2e38d866d79ab0
    results:
      weak1000: {successes: 15, trials: 50, success_rate: 0.30}
      weak1500: {successes: 40, trials: 50, success_rate: 0.80}
      weak1000plus500: {successes: 8, trials: 50, success_rate: 0.16}
    selected: weak1000
    selected_checkpoint:
      path: /vepfs-mlp2/c20250301/240403026/async_vla/async_libero_runs/libero10_decoupled_sft_0to8_rebuilt/W1000_libero10_decoupled_0to8_scalar_age_s4_a4/libero10_delay0to8_s4_a4_weak1000/checkpoint-1000
      sha256: edff533a5c7b9472739577f0b4de8c0bb39f6a93815aad30ec40784538d1adbf
    note: recorded after the code-frozen screen; it does not modify the preregistered rule
