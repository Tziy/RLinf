defaults:
  - env/libero_10_binary@env.train
  - env/libero_10_binary@env.eval
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: ${oc.env:ACTOR_GPU_PLACEMENT,0-3}
    rollout: ${oc.env:ROLLOUT_GPU_PLACEMENT,0-3}
    env: ${oc.env:ENV_GPU_PLACEMENT,0-3}

runner:
  task_type: embodied
  use_training_pipeline: false
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: ${oc.env:PPO_EXPERIMENT_NAME,libero_10_coupled_n1d7_binary_ppo}
    logger_backends: ["tensorboard"]

  max_epochs: ${oc.decode:${oc.env:PPO_MAX_EPOCHS,100}}
  max_steps: ${oc.decode:${oc.env:PPO_MAX_STEPS,-1}}
  weight_sync_interval: ${oc.decode:${oc.env:WEIGHT_SYNC_INTERVAL,1}}

  only_eval: ${oc.decode:${oc.env:ONLY_EVAL,false}}
  eval_before_training: ${oc.decode:${oc.env:PPO_EVAL_BEFORE_TRAINING,true}}
  val_check_interval: ${oc.decode:${oc.env:PPO_VAL_INTERVAL,20}}
  save_interval: ${oc.decode:${oc.env:PPO_SAVE_INTERVAL,-1}}

  resume_dir: ${oc.decode:${oc.env:PPO_RESUME_DIR,null}}
  ckpt_path: ${oc.decode:${oc.env:PPO_CKPT_PATH,null}}
  success_early_stop:
    enabled: ${oc.decode:${oc.env:PPO_SUCCESS_EARLY_STOP_ENABLED,false}}
    metric: ${oc.env:PPO_SUCCESS_EARLY_STOP_METRIC,eval/success_once}
    threshold: ${oc.decode:${oc.env:PPO_SUCCESS_EARLY_STOP_THRESHOLD,0.75}}
    desired_band_low: ${oc.decode:${oc.env:PPO_SUCCESS_EARLY_STOP_BAND_LOW,0.75}}
    desired_band_high: ${oc.decode:${oc.env:PPO_SUCCESS_EARLY_STOP_BAND_HIGH,0.85}}
    protocol_label: ${oc.env:PPO_SUCCESS_EARLY_STOP_PROTOCOL_LABEL,development}

# Match RLinf's native GR00T N1.7 PPO algorithm. Semantic transport changes
# model inputs and placement only; it must not change the optimization rule.
algorithm:
  normalize_advantages: true
  normalize_advantages_by_task: ${oc.decode:${oc.env:PPO_NORMALIZE_ADVANTAGES_BY_TASK,false}}
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: ${oc.decode:${oc.env:TRAIN_ROLLOUT_EPOCH,1}}
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: ${oc.decode:${oc.env:PPO_UPDATE_EPOCHS,1}}
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: ${oc.decode:${oc.env:PPO_KL_BETA,0.0}}
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: ${oc.decode:${oc.env:PPO_GAMMA,0.99}}
  gae_lambda: ${oc.decode:${oc.env:PPO_GAE_LAMBDA,0.95}}

  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  # Post-hoc rows never enter PPO. Hindsight completion is explicitly labeled
  # and used only by a separately weighted self-distillation consistency objective.
  posthoc_semantic_delay_augmentation:
    enabled: ${oc.decode:${oc.env:POSTHOC_SEMANTIC_DELAY_ENABLED,false}}
    delta_frames: [-4, -2, 2, 4, 8]
    seed: ${oc.decode:${oc.env:POSTHOC_SEMANTIC_DELAY_SEED,9473}}
    allow_hindsight_completion: ${oc.decode:${oc.env:POSTHOC_ALLOW_HINDSIGHT_COMPLETION,false}}
    consistency_loss_weight: ${oc.decode:${oc.env:POSTHOC_SEMANTIC_DELAY_WEIGHT,0.0}}
    force_replay_forward: ${oc.decode:${oc.env:POSTHOC_FORCE_REPLAY_FORWARD,false}}
    # PosthocAug consumes only semantic tensors already in the rollout buffer.
    require_nonblocking_rollout: ${oc.decode:${oc.env:POSTHOC_REQUIRE_NONBLOCKING_ROLLOUT,true}}
    # Kept structurally paired with the decoupled config; disabled by default.
    replay_microbatch_interval: ${oc.decode:${oc.env:POSTHOC_REPLAY_MICROBATCH_INTERVAL,1}}
    replay_microbatch_offset: ${oc.decode:${oc.env:POSTHOC_REPLAY_MICROBATCH_OFFSET,0}}

  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: ${oc.decode:${oc.env:TRAIN_NUM_ENVS,126}}
    seed: ${oc.decode:${oc.env:TRAIN_SEED,0}}
    randomize_train_sim_seed_on_reset: ${oc.decode:${oc.env:RANDOMIZE_TRAIN_SIM_SEED_ON_RESET,false}}
    train_sim_seed_low: ${oc.decode:${oc.env:TRAIN_SIM_SEED_LOW,0}}
    train_sim_seed_high: ${oc.decode:${oc.env:TRAIN_SIM_SEED_HIGH,2147483647}}
    task_id_filter: ${oc.decode:${oc.env:TRAIN_TASK_ID_FILTER,null}}
    max_episode_steps: ${oc.decode:${oc.env:TRAIN_MAX_EPISODE_STEPS,480}}
    max_steps_per_rollout_epoch: ${oc.decode:${oc.env:TRAIN_ROLLOUT_STEPS,480}}
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    sparse_chunk_observations: true
    auto_reset: ${oc.decode:${oc.env:TRAIN_AUTO_RESET,true}}
    balance_train_task_assignment: ${oc.decode:${oc.env:BALANCE_TRAIN_TASK_ASSIGNMENT,true}}
    preserve_train_task_assignment: ${oc.decode:${oc.env:PRESERVE_TRAIN_TASK_ASSIGNMENT,true}}
    unique_train_trial_assignment: ${oc.decode:${oc.env:UNIQUE_TRAIN_TRIAL_ASSIGNMENT,false}}
    ignore_terminations: false
    video_cfg:
      save_video: false
  eval:
    total_num_envs: ${oc.decode:${oc.env:EVAL_NUM_ENVS,140}}
    task_id_filter: ${oc.decode:${oc.env:EVAL_TASK_ID_FILTER,null}}
    seed: ${oc.decode:${oc.env:EVAL_SEED,0}}
    rollout_epoch: ${oc.decode:${oc.env:EVAL_ROLLOUT_EPOCH,1}}
    group_size: 1
    auto_reset: ${oc.decode:${oc.env:EVAL_AUTO_RESET,false}}
    ignore_terminations: ${oc.decode:${oc.env:EVAL_IGNORE_TERMINATIONS,false}}
    max_episode_steps: ${oc.decode:${oc.env:EVAL_MAX_EPISODE_STEPS,480}}
    max_steps_per_rollout_epoch: ${oc.decode:${oc.env:EVAL_ROLLOUT_STEPS,480}}
    is_eval: true
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: true
  inference_micro_batch_size: ${oc.decode:${oc.env:ROLLOUT_INFERENCE_MICRO_BATCH_SIZE,0}}
  pipeline_stage_num: 1

  model:
    model_type: ${actor.model.model_type}
    is_lora: ${actor.model.is_lora}
    embodiment_tag: ${actor.model.embodiment_tag}
    obs_converter_type: ${actor.model.obs_converter_type}
    action_dim: ${actor.model.action_dim}
    model_path: ${oc.env:GR00T_MODEL_PATH}
    backbone_model_path: ${oc.env:GR00T_BACKBONE_PATH}
    # Match the decoupled precision boundary: BF16 rollout inference with an
    # independently configurable FSDP actor/master-parameter precision.
    precision: ${oc.env:FDVLA_ROLLOUT_MODEL_PRECISION,bf16}
    num_action_chunks: ${oc.decode:${oc.env:ACTION_CHUNK_SIZE,16}}
    denoising_steps: ${oc.decode:${oc.env:DENOISING_STEPS,4}}
    rl_head_config: ${actor.model.rl_head_config}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: ${oc.decode:${oc.env:PPO_MICRO_BATCH_SIZE,2}}
  global_batch_size: ${oc.decode:${oc.env:PPO_GLOBAL_BATCH_SIZE,1008}}
  seed: 1234
  enable_offload: ${oc.decode:${oc.env:ACTOR_ENABLE_OFFLOAD,true}}
  clear_memory_after_update: ${oc.decode:${oc.env:PPO_CLEAR_MEMORY_AFTER_UPDATE,false}}

  model:
    model_type: "gr00t_n1d7"
    precision: ${oc.env:FDVLA_ACTOR_MODEL_PRECISION,bf16}
    model_path: ${oc.env:GR00T_MODEL_PATH}
    backbone_model_path: ${oc.env:GR00T_BACKBONE_PATH}
    embodiment_tag: "libero_sim"
    add_value_head: true
    num_action_chunks: ${oc.decode:${oc.env:ACTION_CHUNK_SIZE,16}}
    denoising_steps: ${oc.decode:${oc.env:DENOISING_STEPS,4}}
    rl_head_config:
      # The fields above this block match coupled PPO. Only this semantic I/O
      # block and the local-backbone removal implement decoupling.
      execution_mode: coupled
      semantic_server_enabled: false
      semantic_server_non_blocking: true
      semantic_server_central_cache: false
      semantic_feature_tokens: ${oc.decode:${oc.env:SEMANTIC_FEATURE_TOKENS,160}}
      semantic_server_boundary_publish: false
      semantic_control_only_transform: true
      semantic_env_bootstrap_publish: false
      semantic_env_boundary_publish: false
      semantic_publish_interval_frames: ${oc.decode:${oc.env:SEMANTIC_PUBLISH_INTERVAL_FRAMES,0}}
      semantic_mid_chunk_publish: false
      semantic_mid_chunk_frame: ${oc.decode:${oc.env:SEMANTIC_MID_CHUNK_FRAME,10}}
      semantic_mid_chunk_min_frame: ${oc.decode:${oc.env:SEMANTIC_MID_CHUNK_MIN_FRAME,1}}
      semantic_mid_chunk_stagger_by_rank: ${oc.decode:${oc.env:SEMANTIC_MID_CHUNK_STAGGER_BY_RANK,false}}
      # Native coupled is defined by a current-frame local VLM forward. Age
      # controls are disabled here; they are meaningful only for server packets.
      semantic_train_random_age_min_frames: ${oc.decode:${oc.env:SEMANTIC_TRAIN_RANDOM_AGE_MIN_FRAMES,-1}}
      semantic_train_random_age_max_frames: ${oc.decode:${oc.env:SEMANTIC_TRAIN_RANDOM_AGE_MAX_FRAMES,-1}}
      semantic_train_random_age_seed: ${oc.decode:${oc.env:SEMANTIC_TRAIN_RANDOM_AGE_SEED,4242}}
      semantic_eval_random_age_min_frames: ${oc.decode:${oc.env:SEMANTIC_EVAL_RANDOM_AGE_MIN_FRAMES,-1}}
      semantic_eval_random_age_max_frames: ${oc.decode:${oc.env:SEMANTIC_EVAL_RANDOM_AGE_MAX_FRAMES,-1}}
      semantic_eval_random_age_seed: ${oc.decode:${oc.env:SEMANTIC_EVAL_RANDOM_AGE_SEED,2026}}
      semantic_fetch_target_age_frames: ${oc.decode:${oc.env:SEMANTIC_FETCH_TARGET_AGE_FRAMES,-1}}
      semantic_fetch_hard_max_age_frames: ${oc.decode:${oc.env:SEMANTIC_FETCH_HARD_MAX_AGE_FRAMES,-1}}
      # Kept structurally paired with the D config; semantic server is disabled here.
      semantic_skip_latest_before_exact: ${oc.decode:${oc.env:SEMANTIC_SKIP_LATEST_BEFORE_EXACT,false}}
      posthoc_semantic_delay_bank_enabled: ${oc.decode:${oc.env:POSTHOC_SEMANTIC_DELAY_BANK_ENABLED,false}}
      semantic_fetch_max_wait_ms: ${oc.decode:${oc.env:SEMANTIC_FETCH_MAX_WAIT_MS,30000}}
      semantic_fetch_delay_fraction: ${oc.decode:${oc.env:SEMANTIC_FETCH_DELAY_FRACTION,0.0}}
      semantic_fetch_delay_initial_ms: ${oc.decode:${oc.env:SEMANTIC_FETCH_DELAY_INITIAL_MS,0}}
      semantic_fetch_delay_min_ms: ${oc.decode:${oc.env:SEMANTIC_FETCH_DELAY_MIN_MS,0}}
      semantic_fetch_delay_max_ms: ${oc.decode:${oc.env:SEMANTIC_FETCH_DELAY_MAX_MS,0}}
      # Negative keeps real wallclock scheduling. Set this only for deterministic
      # checkpoint selection; final system eval must leave it disabled.
      semantic_eval_fixed_age_frames: ${oc.decode:${oc.env:SEMANTIC_EVAL_FIXED_AGE_FRAMES,-1}}
      semantic_eval_fixed_age_max_wait_ms: ${oc.decode:${oc.env:SEMANTIC_EVAL_FIXED_AGE_MAX_WAIT_MS,30000}}
      # Keep the model prediction horizon at 16 while executing only this prefix
      # during rollout/evaluation. Negative preserves the full predicted horizon.
      train_execution_horizon: ${oc.decode:${oc.env:TRAIN_EXECUTION_HORIZON,-1}}
      eval_execution_horizon: ${oc.decode:${oc.env:EVAL_EXECUTION_HORIZON,-1}}
      semantic_age_mode: "simulator"
      semantic_control_hz: 20.0
      require_packet_age_input: ${oc.decode:${oc.env:REQUIRE_PACKET_AGE_INPUT,false}}
      initialize_packet_age_adapter: ${oc.decode:${oc.env:INITIALIZE_PACKET_AGE_ADAPTER,false}}
      initialize_action_history_length: ${oc.decode:${oc.env:ACTION_HISTORY_LENGTH,0}}
      zero_init_new_delay_adapters: ${oc.decode:${oc.env:ZERO_INIT_NEW_DELAY_ADAPTERS,false}}
      value_head_init_seed: ${oc.decode:${oc.env:VALUE_HEAD_INIT_SEED,0}}
      require_frozen_vlm: true
      verify_semantic_replay: false
      semantic_zero_packet_age: ${oc.decode:${oc.env:SEMANTIC_ZERO_PACKET_AGE,false}}
      semantic_zero_action_history: ${oc.decode:${oc.env:SEMANTIC_ZERO_ACTION_HISTORY,false}}
      semantic_server_host: "127.0.0.1"
      semantic_server_port: "${oc.env:SEMANTIC_SERVER_PORT,6677}"
      semantic_server_publish_port: "${oc.env:SEMANTIC_SERVER_PUBLISH_PORT,6678}"
      semantic_server_timeout_ms: 120000

      add_value_head: true
      joint_logprob: false
      noise_method: "flow_sde"
      noise_level: 0.5
      noise_anneal: false
      noise_params: [0.7, 0.3, 400]
      action_noise_scale: ${oc.decode:${oc.env:PPO_ACTION_NOISE_SCALE,0.0}}
      deterministic_eval_noise: ${oc.decode:${oc.env:DETERMINISTIC_EVAL_NOISE,true}}
      eval_noise_seed: ${oc.decode:${oc.env:EVAL_NOISE_SEED,2026}}
      eval_audit_metadata: true
      use_vlm_value: false
      value_vlm_mode: "mean_token"
      chunk_critic_input: false
      detach_critic_input: true
      safe_get_logprob: false
      # Match the semantic server and cached-semantic SFT preprocessing. The
      # coupled local VLM must not silently use the legacy 570-token sequence.
      padding_value: ${oc.decode:${oc.env:SEMANTIC_TEXT_PADDING_TOKENS,160}}
      disable_dropout: true

      dit_only_train: true
      dit_train_last_n_blocks: ${oc.decode:${oc.env:DIT_TRAIN_LAST_N_BLOCKS,0}}
      semantic_adapter_only_train: ${oc.decode:${oc.env:SEMANTIC_ADAPTER_ONLY_TRAIN,false}}
      train_value_head_with_dit_only: ${oc.decode:${oc.env:TRAIN_VALUE_HEAD_WITH_DIT_ONLY,false}}
      drop_local_backbone: false
      trainable_modules:
        - "action_head.model"
        - "action_head.value_head"

  optim:
    lr: ${oc.decode:${oc.env:PPO_ACTOR_LR,1.0e-7}}
    value_lr: ${oc.decode:${oc.env:PPO_VALUE_LR,2.0e-5}}
    override_lr_on_resume: ${oc.decode:${oc.env:PPO_OVERRIDE_LR_ON_RESUME,false}}
    adam_beta1: 0.9
    adam_beta2: 0.95
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: ${oc.decode:${oc.env:PPO_CRITIC_WARMUP_STEPS,0}}

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: true
    limit_all_gathers: ${oc.decode:${oc.env:DIT_LIMIT_ALL_GATHERS,true}}
    cpu_offload: ${oc.decode:${oc.env:DIT_CPU_OFFLOAD,false}}
    use_orig_params: true
    mixed_precision:
      param_dtype: "bf16"
      reduce_dtype: "bf16"
      buffer_dtype: "bf16"

reward:
  use_reward_model: false

critic:
  use_critic_model: false
